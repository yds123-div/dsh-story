          records.push({ kind:'turn_end', ts:turnTs+ri(1000,15000), creator:cid, sessionId:sid, turn:t, reason });
        }
      }
      pv += ri(1,5); sess += nSess;
    });
    daily.push({ x: localDate(new Date(dayStart)), pageviews: pv+ri(2,9), sessions: sess });
  }
  return {
    generatedAt: new Date().toISOString(),
    records: records.sort((a,b)=>a.ts-b.ts),
    umami: {
      websiteId: 'demo', stats: {
        pageviews: daily.reduce((a,b)=>a+b.pageviews,0), visitors: 6,
        visits: daily.reduce((a,b)=>a+b.sessions,0), bounces: 9, totaltime: 61200,
      },
      daily, events: umamiEvents.sort((a,b)=>a.ts-b.ts),
    },
  };
}

/* ================= 工具 ================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtK = n => n == null ? '—' : n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(n);
const fmtMs = n => n == null ? '—' : n >= 1000 ? (n/1000).toFixed(1)+'s' : Math.round(n)+'ms';
const fmtTs = ts => new Date(ts).toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });
const dkey = ts => { const d = new Date(ts); return (d.getMonth()+1)+'/'+d.getDate(); };
const dayLabel = isoDate => Number(isoDate.slice(5,7))+'/'+Number(isoDate.slice(8,10)); // '2026-09-16' → '9/16'
const shortId = id => (id||'').slice(0,8);
const $ = (sel, el=document) => el.querySelector(sel);

/* ================= 聚合（过滤行作用于此层：所有卡片共用同一份切片） ================= */
function agg(opt = {}) {
  const { creator = null } = opt;
  const ds = dataset();
  const from = state.range === 'all' ? -Infinity
    : state.range === '1' ? new Date().setHours(0,0,0,0)   // 「今天」= 本地日历日
    : Date.now() - 7*864e5;
  const recs = ds.records.filter(r => r.ts >= from && (!creator || r.creator === creator));
  const llm = recs.filter(r => r.kind === 'llm_call');
  const sess = recs.filter(r => r.kind === 'session_created');
  const turns = recs.filter(r => r.kind === 'turn_end');
  const events = (ds.umami?.events || []).filter(e => e.ts >= from && (!creator || e.creator === creator));
  const daily = (ds.umami?.daily || []).filter(d => Date.parse(d.x + 'T23:59:59') >= from);

  // 连续日桶（覆盖记录跨度）
  let days = [], byDay = {};
  if (recs.length) {
    let t0 = Math.min(...recs.map(r=>r.ts)), t1 = Math.max(...recs.map(r=>r.ts));
    const d0 = new Date(t0); d0.setHours(0,0,0,0);
    for (let t = d0.getTime(); t <= t1; t += 864e5) {
      const k = dkey(t);
      days.push(k); byDay[k] = { beh:0, sys:0, in:0, out:0, cr:0, cw:0, rs:0, calls:0, lat:0 };
    }
  }
  for (const r of llm) {
    const b = byDay[dkey(r.ts)]; if (!b) continue;
    const u = r.usage || {};
    const tot = (u.inputTokens||0)+(u.outputTokens||0)+(u.cacheReadTokens||0)+(u.cacheWriteTokens||0)+(u.reasoningTokens||0);
    if (r.purpose === 'behavior') b.beh += tot; else b.sys += tot;
    b.in += u.inputTokens||0; b.out += u.outputTokens||0; b.cr += u.cacheReadTokens||0;
    b.cw += u.cacheWriteTokens||0; b.rs += u.reasoningTokens||0;
    b.calls++; b.lat += r.latencyMs||0;
  }
  const tokensOf = r => { const u = r.usage||{};
    return (u.inputTokens||0)+(u.outputTokens||0)+(u.cacheReadTokens||0)+(u.cacheWriteTokens||0)+(u.reasoningTokens||0); };
  const tokensTotal = llm.reduce((a,r)=>a+tokensOf(r),0);
  const tokensBeh = llm.filter(r=>r.purpose==='behavior').reduce((a,r)=>a+tokensOf(r),0);
  const tokensSys = tokensTotal - tokensBeh;

  // 模型
  const byModel = new Map();
  for (const r of llm) {
    const k = r.model + ' · ' + r.provider;
    if (!byModel.has(k)) byModel.set(k, { model:r.model, provider:r.provider, calls:0, tokens:0, lat:0 });
    const m = byModel.get(k);
    m.calls++; m.tokens += tokensOf(r); m.lat += r.latencyMs||0;
  }

  // 创作者
  const byCreator = new Map();
  for (const r of recs) {
    if (!r.creator) continue;
    if (!byCreator.has(r.creator)) byCreator.set(r.creator, { id:r.creator, tokens:0, calls:0, sessions:new Set(), turns:0, fails:0, last:0 });
    const c = byCreator.get(r.creator);
    c.last = Math.max(c.last, r.ts);
    if (r.kind === 'session_created') c.sessions.add(r.sessionId);
    if (r.kind === 'llm_call') { c.calls++; c.tokens += tokensOf(r); }
    if (r.kind === 'turn_end') { c.turns++; if (r.reason && r.reason.kind !== 'completed') c.fails++; }
  }

  // turn 结局
  const outcome = { completed:0, 'llm-failure':0, interrupted:0, other:0 };
  for (const t of turns) outcome[t.reason?.kind || 'other'] = (outcome[t.reason?.kind || 'other']||0) + 1;
  const turnRate = turns.length ? outcome.completed/turns.length : null;

  // 时间线（自建 + Umami 合并，倒序）
  const timeline = [
    ...recs.map(r => ({ ts:r.ts, src:'自建', creator:r.creator, sessionId:r.sessionId, kind:r.kind, rec:r })),
    ...events.map(e => ({ ts:e.ts, src:'Umami', creator:e.creator, kind:'umami-event', ev:e })),
  ].sort((a,b) => b.ts - a.ts);

  const pv = daily.reduce((a,d)=>a+d.pageviews,0);
  const visits = daily.reduce((a,d)=>a+d.sessions,0);

  return {
    ds, recs, llm, sess, turns, events, daily, days, byDay, byModel, byCreator, outcome, turnRate, timeline,
    tokensTotal, tokensBeh, tokensSys, pv, visits,
    creators: [...byCreator.values()].sort((a,b)=>b.tokens-a.tokens),
    mediaEvents: events.filter(e=>e.name==='media_job_confirmed'),
    latencyAvg: llm.length ? llm.reduce((a,r)=>a+(r.latencyMs||0),0)/llm.length : null,
  };
}

/* ================= ECharts 封装 ================= */
let charts = [];
function mkChart(el, option) {
  const c = echarts.init(el); c.setOption(option); charts.push(c); return c;
}
function disposeCharts(){ charts.forEach(c=>c.dispose()); charts = []; }
addEventListener('resize', () => charts.forEach(c=>c.resize()));

function ttFormatter(params, fmt) {
  if (typeof fmt !== 'function') fmt = fmtK; // ECharts 第二参是 ticket 字符串
  const ps = params.filter(p => p.value != null && p.value !== '-');
  if (!ps.length) return '';
  const rows = ps.map(p =>
    `<div class="tt-row" style="display:flex;align-items:center;gap:6px;margin-top:2px">
       <b style="min-width:3.5em;text-align:right">${esc(fmt(p.value))}</b>
       <span style="width:10px;height:3px;border-radius:2px;background:${p.color};display:inline-block"></span>
       <span style="color:${T().ink2}">${esc(p.seriesName)}</span>
     </div>`).join('');
  return `<div style="font-size:12px;color:${T().muted};margin-bottom:2px">${esc(ps[0].axisValue)}</div>${rows}`;
}
const gridOpt = () => ({ left: 6, right: 14, top: 34, bottom: 4, containLabel: true });
const catAxis = data => ({ type:'category', data, axisLine:{ lineStyle:{ color:T().axis } }, axisTick:{ show:false },
  axisLabel:{ color:T().muted, fontSize:11 } });
const valAxis = (unit='') => ({ type:'value', splitLine:{ lineStyle:{ color:T().grid, width:1 } },
  axisLabel:{ color:T().muted, fontSize:11, formatter: v => fmtK(v) + unit } });
const tooltipOpt = () => ({ trigger:'axis', axisPointer:{ type:'line', lineStyle:{ color:T().axis } },
  backgroundColor:T().surface, borderColor:T().grid, borderWidth:1, padding:[8,12],
  textStyle:{ color:T().ink, fontSize:12 } });
const legendOpt = names => ({ top: 0, right: 0, itemWidth: 14, itemHeight: 8, itemGap: 14,
  textStyle:{ color:T().ink2, fontSize:11 } });

function barStack(el, days, series) { // series: [{name, data, color?}]
  const t = T();
  chart_colors(series);
  mkChart(el, {
    grid: gridOpt(), tooltip: { ...tooltipOpt(), formatter: ttFormatter },
    legend: legendOpt(series.map(s=>s.name)),
    xAxis: catAxis(days), yAxis: valAxis(),
    series: series.map((s,i) => ({
      name:s.name, type:'bar', stack:'t', barMaxWidth: 22,
      itemStyle: { color:s.color, borderColor:t.surface, borderWidth:1,
        borderRadius: i === series.length-1 ? [4,4,0,0] : 0 },
      data: s.data,
    })),
  });
}
function barSingle(el, cats, values, { color, fmt = fmtK, unit = '' } = {}) {
  const t = T();
  mkChart(el, {
    grid: gridOpt(), tooltip: { ...tooltipOpt(), formatter: p => ttFormatter(p, fmt) },
    xAxis: catAxis(cats), yAxis: valAxis(unit),
    series: [{ type:'bar', barMaxWidth: 22,
      itemStyle: { color, borderRadius:[4,4,0,0] },
      label: { show:true, position:'top', color:t.ink2, fontSize:11, formatter: p => fmt(p.value) },
      data: values }],
  });
}
function lineChart(el, days, series) { // series: [{name, data, color}]
  const t = T();
  mkChart(el, {
    grid: gridOpt(), tooltip: { ...tooltipOpt(), formatter: ttFormatter },
    legend: legendOpt(series.map(s=>s.name)),
    xAxis: catAxis(days), yAxis: valAxis(),
    series: series.map(s => ({
      name:s.name, type:'line', data:s.data,
      lineStyle:{ width:2, cap:'round', join:'round' },
      symbol:'circle', symbolSize:8,
      itemStyle:{ color:s.color, borderColor:t.surface, borderWidth:2 },
      emphasis:{ focus:'series' },
    })),
  });
}
// 五桶等固定身份 → 固定槽位；其余按传入顺序取槽
function chart_colors(series){
  const t = T();
  series.forEach((s,i) => { if (!s.color) s.color = t.series[i % t.series.length]; });
}

/* ================= 卡片 ================= */
function card({ title, sub, table, tall = false, bodyHTML = '', cls = '' }) {
  const el = document.createElement('section');
  el.className = 'card ' + cls;
  el.innerHTML = `
    <div class="card-head">
      <h2>${esc(title)}</h2>${sub ? `<span class="sub">${esc(sub)}</span>` : ''}
      ${table ? '<button type="button" class="tbl-btn">表格</button>' : ''}
    </div>
    <div class="card-body">${bodyHTML}</div>`;
  if (table) {
    const body = $('.card-body', el);
    $('.tbl-btn', el).addEventListener('click', ev => {
      const btn = ev.currentTarget;
      const existing = $('.twin-wrap', el);
      if (existing) { existing.remove(); btn.textContent = '表格'; return; }
      const wrap = document.createElement('div');
      wrap.className = 'twin-wrap';
      const rows = table().rows.map(r => `<tr>${r.map((c,i) => `<td${table().nums && table().nums[i] ? ' class="num"' : ''}>${c}</td>`).join('')}</tr>`).join('');
      wrap.innerHTML = `<table class="twin">
        <thead><tr>${table().headers.map((h,i) => `<th${table().nums && table().nums[i] ? ' class="num"' : ''}>${esc(h)}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody></table>`;
      body.appendChild(wrap);
      btn.textContent = '图表';
    });
  }
  return el;
}
function tile(label, valueHTML, detailHTML = '') {
  const el = document.createElement('div');
  el.className = 'tile';
  el.innerHTML = `<div class="label">${esc(label)}</div><div class="value">${valueHTML}</div>${detailHTML ? `<div class="detail">${detailHTML}</div>` : ''}`;
  return el;
}
function meterHTML(rate, label) {
  const pct = rate == null ? 0 : Math.round(rate*100);
  const cls = rate == null ? '' : rate >= 0.9 ? '' : rate >= 0.7 ? 'warn' : 'crit';
  return `<div class="meter-row"><span class="v">${rate == null ? '—' : pct + '%'}</span><span class="l">${esc(label)}</span></div>
    <div class="meter"><div class="meter-fill ${cls}" style="width:${pct}%"></div></div>`;
}
function emptyBox(title, hint) {
  return `<div class="empty"><b>${esc(title)}</b>${esc(hint)}</div>`;
}

  kpis.appendChild(tile('AI 调用', fmtK(b.llm.length), `平均延迟 ${fmtMs(b.latencyAvg)}`));
  kpis.appendChild(tile('会话', fmtK(b.sess.length)));
  kpis.appendChild(tile('Turn 成功率', meterHTML(b.turnRate, `完成 ${b.outcome.completed}/${b.turns.length}`)));
  detail.appendChild(kpis);

  const g = document.createElement('div'); g.className = 'grid-2';
  g.appendChild(card({
    title:'每日 Token 消耗', sub:`${shortId(state.creator)}`,
    bodyHTML:'<div class="chart-box" data-chart="b-day"></div>',
    table: () => ({ headers:['日期','行为','系统开销 C3'], nums:[false,true,true],
      rows: b.days.map(d => [d, fmtK(b.byDay[d].beh), fmtK(b.byDay[d].sys)]) }),
  }));
  const bModels = [...b.byModel.values()].sort((x,y)=>y.tokens-x.tokens);
  g.appendChild(card({
    title:'模型分布', sub:'Token 按模型',
    bodyHTML:'<div class="chart-box" data-chart="b-model"></div>',
    table: () => ({ headers:['模型','Token','调用'], nums:[false,true,true],
      rows: bModels.map(m => [m.model, fmtK(m.tokens), m.calls]) }),
  }));
  detail.appendChild(g);

  // 真实 Umami 事件未带 creator_id 属性（v1 上报后可对齐）→ 真实模式列全部，模拟模式按 creator 过滤
  const evList = state.src === 'real' ? a.events : b.events;
  const evRows = evList.slice().reverse().map(e => {
    const d = new Date(e.ts);
    const detail2 = [e.name, e.jobKind, e.device, e.browser].filter(Boolean).join(' · ');
    return `<tr><td class="ts">${esc(fmtTs(e.ts))}</td><td><span class="src-badge">Umami</span></td><td>${esc(detail2)}</td><td class="num">${esc(e.url||'')}</td></tr>`;
  }).join('');
  const evTable = `<table class="twin"><thead><tr><th>时间</th><th>来源</th><th>事件</th><th>路径</th></tr></thead>
    <tbody>${evRows || '<tr><td colspan="4" style="color:var(--muted)">无对齐事件</td></tr>'}</tbody></table>`;
  const realHint = state.src === 'real'
    ? '<p class="note">真实 Umami 事件尚未带 creator_id 属性（v1 正式上报后可按人对齐），此处暂列全部事件。</p>' : '';
  detail.appendChild(card({
    title:'Umami 事件（按 creator 对齐）', sub:'前端可见行为',
    bodyHTML: `<div class="timeline" style="max-height:280px">${evTable}</div>${realHint}`,
  }));

  layout.appendChild(detail);
  view.appendChild(layout);

  barStack($('[data-chart="b-day"]'), b.days, [
    { name:'行为', data: b.days.map(d=>b.byDay[d].beh), color: T().series[0] },
    { name:'系统开销 C3', data: b.days.map(d=>b.byDay[d].sys), color: T().series[1] },
  ]);
  barSingle($('[data-chart="b-model"]'), bModels.map(m=>m.model), bModels.map(m=>m.tokens), { color: T().series[0] });
}

/* ================= 变体 C — 事件监控台 ================= */
function renderC(a, view) {
  const meters = document.createElement('section');
  meters.className = 'meters-row';
  const m1 = card({ title:'Turn 成功率', bodyHTML: meterHTML(a.turnRate, `完成 ${a.outcome.completed}/${a.turns.length}`) });
  const behShare = a.tokensTotal ? a.tokensBeh/a.tokensTotal : null;
  const m2 = card({ title:'行为 Token 占比', sub:'其余为系统开销 C3',
    bodyHTML: meterHTML(behShare, `行为 ${fmtK(a.tokensBeh)} / 合计 ${fmtK(a.tokensTotal)}`) });
  const fails = a.outcome['llm-failure'] + a.outcome.interrupted;
  const m3 = card({ title:'失败 / 中断 / 延迟', bodyHTML: `
    <div style="display:flex;gap:22px;margin-top:6px;flex-wrap:wrap">
      <div><div class="value" style="font-size:22px;font-weight:600">${fails}</div><div class="l" style="font-size:12px;color:var(--muted)">失败 + 中断 turn</div></div>
      <div><div style="font-size:22px;font-weight:600">${fmtMs(a.latencyAvg)}</div><div style="font-size:12px;color:var(--muted)">平均调用延迟</div></div>
      <div><div style="font-size:22px;font-weight:600">${fmtK(a.mediaEvents.length)}</div><div style="font-size:12px;color:var(--muted)">媒体任务确认（Umami）</div></div>
    </div>` });
  meters.append(m1, m2, m3);
  view.appendChild(meters);

  // 时间线
  const CAP = 300;
  const rows = a.timeline.slice(0, CAP).map(e => {
    let kind = '', detail = '', fail = false;
    if (e.kind === 'umami-event') {
      kind = e.ev.name;
      detail = [e.ev.jobKind, e.ev.device, e.ev.browser, e.ev.url].filter(Boolean).join(' · ');
    } else if (e.kind === 'session_created') {
      kind = '会话创建'; detail = e.sessionId;
    } else if (e.kind === 'llm_call') {
      kind = 'LLM 调用';
      const u = e.rec.usage || {};
      detail = `${e.rec.purpose} · ${e.rec.model} · ${fmtK(u.inputTokens||0)} in / ${fmtK(u.outputTokens||0)} out · ${fmtMs(e.rec.latencyMs)}`;
    } else if (e.kind === 'turn_end') {
      kind = 'Turn 结束';
      fail = e.rec.reason && e.rec.reason.kind !== 'completed';
      detail = fail ? `第 ${e.rec.turn} 轮 · ${e.rec.reason.kind}${e.rec.reason.code ? ' '+e.rec.reason.code : ''}` : `第 ${e.rec.turn} 轮 · 完成`;
    } else if (e.kind === 'assistant_message') {
      kind = '回复完成'; detail = `turn ${e.rec.turn} · step ${e.rec.step}`;
    } else { kind = e.kind; }
    return `<tr${fail ? ' class="fail"' : ''}>
      <td class="ts">${esc(fmtTs(e.ts))}</td>
      <td><span class="src-badge">${esc(e.src)}</span></td>
      <td title="${esc(e.creator||'')}">${esc(shortId(e.creator))}</td>
      <td${fail ? ' style="color:var(--crit);font-weight:600"' : ''}>${fail ? '✕ ' : ''}${esc(kind)}</td>
      <td style="white-space:normal">${esc(detail)}</td></tr>`;
  }).join('');
  const tl = card({
    title:'事件时间线', sub:`自建 + Umami 合并 · 倒序 · 共 ${a.timeline.length} 条${a.timeline.length > CAP ? `，显示前 ${CAP}` : ''}`,
    bodyHTML: `<div class="timeline"><table class="tl">
      <thead><tr><th>时间</th><th>来源</th><th>创作者</th><th>事件</th><th>详情</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" style="color:var(--muted)">该范围内没有事件</td></tr>'}</tbody></table></div>`,
  });
  view.appendChild(tl);

  const g = document.createElement('div'); g.className = 'grid-2';
  g.appendChild(card({
    title:'平均调用延迟按天',
    bodyHTML:'<div class="chart-box" data-chart="c-lat"></div>',
    table: () => ({ headers:['日期','平均延迟','调用'], nums:[false,true,true],
      rows: a.days.map(d => { const b = a.byDay[d]; return [d, fmtMs(b.calls?b.lat/b.calls:0), b.calls]; }) }),
  }));
  g.appendChild(turnCard(a));
  view.appendChild(g);

  lineChart($('[data-chart="c-lat"]'), a.days, [
    { name:'平均延迟', data: a.days.map(d => { const b = a.byDay[d]; return b.calls ? Math.round(b.lat/b.calls) : null; }), color: T().series[0] },
  ]);
}

/* ================= 渲染 & 路由 ================= */
function render() {
  document.documentElement.dataset.theme = state.theme;
  disposeCharts();
  const view = $('#view');
  view.innerHTML = '';
  const a = agg();
  if (state.variant === 'A') renderA(a, view);
  else if (state.variant === 'B') renderB(a, view);
  else renderC(a, view);

  const v = VARIANTS.find(v => v.key === state.variant) || VARIANTS[0];
  $('#variantLabel').textContent = `${v.key} — ${v.name}`;
  const ds = dataset();
  $('#scopeInfo').textContent = state.src === 'demo'
    ? `模拟数据（种子 20260917）· ${ds.records.length} 条记录`
    : `生成于 ${new Date(ds.generatedAt).toLocaleString('zh-CN')} · ${ds.records.length} 条自建记录${ds.umami ? ' + Umami' : '（Umami 不可达）'}`;
  syncSeg();
  pushUrl();
}
function pushUrl() {
  const p = new URLSearchParams({ variant: state.variant, src: state.src, range: state.range, theme: state.theme });
  history.replaceState(null, '', location.pathname + '?' + p);
}
function syncSeg() {
  for (const b of $('#srcSeg').children) b.setAttribute('aria-pressed', String(b.dataset.src === state.src));
  for (const b of $('#rangeSeg').children) b.setAttribute('aria-pressed', String(b.dataset.range === state.range));
}

$('#srcSeg').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  state.src = b.dataset.src; render();
});
$('#rangeSeg').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  state.range = b.dataset.range; render();
});
$('#themeBtn').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark'; render();
});

function cycle(dir) {
  const i = VARIANTS.findIndex(v => v.key === state.variant);
  state.variant = VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key;
  render();
}
$('#prevBtn').addEventListener('click', () => cycle(-1));
$('#nextBtn').addEventListener('click', () => cycle(1));
addEventListener('keydown', ev => {
  if (ev.target.matches('input, textarea, [contenteditable]')) return;
  if (ev.key === 'ArrowLeft') cycle(-1);
  if (ev.key === 'ArrowRight') cycle(1);
});

render();
</script>
</body>
</html>
